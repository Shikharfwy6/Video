name: Unzip project

on:
  workflow_dispatch:
  push:
    paths:
      - "video-editing-explainer.zip"

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          unzip -q -o video-editing-explainer.zip -d /tmp/x
          rm -rf /tmp/x/explainer/.github
          cp -a /tmp/x/explainer/. .
          rm video-editing-explainer.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unzip project" || echo "Nothing to commit"
          git push
