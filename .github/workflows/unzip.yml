name: Delete old files and unzip

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Find zip
        run: |
          ZIP=$(ls *.zip | head -n1)
          echo "ZIP=$ZIP" >> $GITHUB_ENV
          echo "Using $ZIP"

      - name: Delete old files (keeps .git, .github and the zip)
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" ! -name ".github" ! -name "$ZIP" \
            -exec rm -rf {} +

      - name: Unzip new project
        run: |
          rm -rf /tmp/x && mkdir /tmp/x
          unzip -q -o "$ZIP" -d /tmp/x
          rm -rf /tmp/x/*/.github
          cp -a /tmp/x/*/. .
          rm -f "$ZIP"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace project with new zip" || echo "Nothing to commit"
          git push
